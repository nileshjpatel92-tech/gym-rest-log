<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the full iPhone screen, including behind the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rest Log</title>

  <!-- These tags tell iOS to open the app full screen when launched from the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rest Log">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Bump ?v= whenever style.css or app.js changes, so browsers fetch the new copy instead of a cached one -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <!-- Each <section> is one "screen". The JavaScript shows one at a time. -->

  <!-- HOME -->
  <section id="screen-home" class="screen">
    <h1 class="title">Rest Log</h1>
    <button id="btn-start" class="big primary">Start workout</button>
    <button id="btn-history" class="big secondary">History</button>
    <button id="btn-my-lifts" class="big secondary">My lifts</button>
    <button id="btn-test-sound" class="big ghost">Test sounds</button>
  </section>

  <!-- ACTIVE WORKOUT -->
  <section id="screen-workout" class="screen" hidden>
    <button id="btn-lift" class="lift-switch">
      <span id="lift-name">Pick a lift</span>
      <span class="chev">Change ▾</span>
    </button>

    <div class="timer-box" id="timer-box">
      <div id="timer" class="timer">0:00</div>
      <div class="target-row">
        <button id="btn-target-down" class="pill">−15s</button>
        <span>Target <strong id="target">2:00</strong></span>
        <button id="btn-target-up" class="pill">+15s</button>
      </div>
    </div>

    <div class="inputs">
      <div class="field">
        <label for="weight">Weight (lb)</label>
        <div class="stepper">
          <button class="step" data-field="weight" data-delta="-5">−</button>
          <input id="weight" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          <button class="step" data-field="weight" data-delta="5">+</button>
        </div>
      </div>
      <div class="field">
        <label for="reps">Reps</label>
        <div class="stepper">
          <button class="step" data-field="reps" data-delta="-1">−</button>
          <input id="reps" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
          <button class="step" data-field="reps" data-delta="1">+</button>
        </div>
      </div>
    </div>

    <button id="btn-main" class="huge primary">Save set &amp; rest</button>

    <ol id="set-list" class="set-list"></ol>

    <button id="btn-end" class="big danger">End workout</button>
  </section>

  <!-- LIFT PICKER (also "My lifts" from the home screen) -->
  <section id="screen-lifts" class="screen" hidden>
    <div class="header-row">
      <button id="btn-lifts-back" class="pill">‹ Back</button>
      <h2 id="lifts-title">Pick a lift</h2>
      <button id="btn-edit-lifts" class="pill">Edit</button>
    </div>
    <button id="btn-add-lift" class="big secondary">+ Add a lift</button>
    <ul id="lift-list" class="lift-list"></ul>
  </section>

  <!-- ADD A LIFT: type to filter the common lifts, or add your own -->
  <section id="screen-add" class="screen" hidden>
    <div class="header-row">
      <button id="btn-add-back" class="pill">‹ Back</button>
      <h2>Add a lift</h2>
      <span class="spacer"></span>
    </div>
    <input id="add-search" class="search" type="text" placeholder="Type to search…" autocomplete="off" autocorrect="off" autocapitalize="words" enterkeyhint="done">
    <ul id="add-results" class="lift-list"></ul>
    <div id="add-custom" class="custom-box" hidden>
      <p>Not listed? Add “<strong id="custom-name"></strong>” as your own lift:</p>
      <div class="group-btns">
        <button class="pill" data-group="push">Push</button>
        <button class="pill" data-group="pull">Pull</button>
        <button class="pill" data-group="legs">Legs</button>
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="screen-history" class="screen" hidden>
    <div class="header-row">
      <button id="btn-history-back" class="pill">‹ Back</button>
      <h2>History</h2>
      <button id="btn-edit-history" class="pill">Edit</button>
    </div>
    <div id="history-list"></div>
  </section>

  <script src="app.js?v=4"></script>
</body>
</html>
